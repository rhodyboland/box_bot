ekf_filter_node_odom:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odom (local continuity). Use the diff-drive controller's integrated
    # pose for local odom; GPS owns global/map corrections.
    odom0: /hoverboard_base_controller/odom
    odom0_config: [
      true,  true,  false,   # x, y, z
      false, false, true,    # roll, pitch, yaw
      false, false, false,   # vx, vy, vz
      false, false, false,   # vroll, vpitch, vyaw
      false, false, false    # ax, ay, az
    ]
    odom0_differential: false
    odom0_relative: true
    odom0_queue_size: 5

    # Physical IMU is used only as a short-term yaw-rate source. Do not fuse its
    # absolute orientation; GPS moving-baseline owns global heading.
    imu0: /imu/data
    imu0_config: [
      false, false, false,   # x, y, z
      false, false, false,   # roll, pitch, yaw
      false, false, false,   # vx, vy, vz
      false, false, true,    # vroll, vpitch, vyaw
      false, false, false    # ax, ay, az
    ]
    imu0_differential: false
    imu0_relative: false


navsat_transform:
  ros__parameters:
    frequency: 5.0
    delay: 2.0
    log_level: "ERROR"
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true

    # The input is /odometry/global, whose yaw fuses absolute GNSS heading.
    # Use that same pose/yaw sample to avoid a fixed map/UTM rotation caused
    # by independently initialized raw-heading and filtered-heading inputs.
    use_odometry_yaw: true
    broadcast_cartesian_transform: true
    publish_filtered_gps: false

    wait_for_datum: false


ekf_filter_node_map:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 1.0      # allow short GNSS dropouts without instantly timing out
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # GPS odometry from navsat_transform
    odom0: /odometry/gps
    odom0_config: [
      true,  true,  false,   # x, y
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5

    # Local odom contributes velocity only. GPS still owns global position, but
    # this keeps the map EKF's velocity state from running away while stationary.
    odom1: /odometry/local
    odom1_config: [
      false, false, false,   # x, y, z
      false, false, false,   # roll, pitch, yaw
      true,  true,  false,   # vx, vy, vz
      false, false, false,   # vroll, vpitch, vyaw
      false, false, false    # ax, ay, az
    ]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 5

    # Absolute heading from the moving-base F9P after launch-level yaw offset.
    # Its covariance is adjusted upstream as baseline/RTK quality changes.
    imu0: /gps/heading_corrected
    imu0_config: [
      false, false, false,
      false, false, true,    # yaw
      false, false, false,
      false, false, false,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false

    # Physical IMU yaw-rate keeps map yaw moving smoothly between absolute GPS
    # heading updates and lets high GPS yaw covariance actually reduce trust.
    imu1: /imu/data
    imu1_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,    # vyaw
      false, false, false
    ]
    imu1_differential: false
    imu1_relative: false
